services:
  backend:
    image: sgwar/gsc-portal-backend:latest
    container_name: gsc_backend
    env_file:
      - .env.production
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3000:3000" # Nginx가 /api/*를 3000포트로 전달
    environment:
      - TZ=${TIME_ZONE}
      - NODE_ENV=production
      - DB_HOST=db        # Docker 내부 'db' 서비스 사용
      - DB_PORT=${DB_PORT}  # .env에서 읽기
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=${REDIS_HOST}   
      - REDIS_PORT=${REDIS_PORT}      
      - REDIS_USER=${REDIS_USER}      
      - REDIS_PASSWORD=${REDIS_PASSWORD} 
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gsc
    restart: always

  db:
    image: mysql:8.0
    container_name: gsc_db
    env_file:
      - .env.production
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - TZ=${TIME_ZONE}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
      - ./mysql/conf.d:/etc/mysql/conf.d
    ports: 
      - "3306:3306"
    networks:
      - gsc
    restart: always

networks:
  gsc:
    driver: bridge

volumes:
  db_data:
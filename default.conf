# nginx/default.conf 파일 내용 (예시)
server {
    listen 80; # frontend 컨테이너 내부 포트

    # 클라이언트에서 API 요청 시 backend 컨테이너로 프록시
    location /api/ {
        # backend 서비스의 Docker 내부 이름과 포트
        proxy_pass http://backend:3000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 모든 정적 파일 및 SPA 라우팅 처리
    location / {
        # frontend 이미지 빌드 시에 index.html 및 정적 파일이 위치한 경로
        root   /usr/share/nginx/html; 
        index  index.html;
        
        # 🚨 404 에러를 해결하는 핵심 설정 🚨
        try_files $uri $uri/ /index.html; 
    }
}
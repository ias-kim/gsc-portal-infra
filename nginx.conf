server {
    listen 8080;
    server_name _;

    # -------------------------
    # 1) API → 백엔드 도커
    # -------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------
    # 2) 프론트엔드 → frontend 도커
    # -------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        
        # SPA 라우팅을 위해 필요!
        proxy_set_header Host $host;
    }
}